[project]
name = "autoportonager-engine"
version = "0.1.0"
description = "Autoportonager Engine - Automated Algorithmic Portfolio & Trading Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<5.3",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.0",
    "drf-spectacular>=0.27.0",
    "django-cors-headers>=4.3.0",
    "django-redis>=5.4.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "django-celery-beat>=2.6.0",
    "django-celery-results>=2.5.0",
    "psycopg[binary]>=3.1.18",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "pandas-market-calendars>=4.4.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "cryptography>=42.0.0",
    "structlog>=24.1.0",
    "alpaca-py>=0.21.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=21.2.0",
    "whitenoise>=6.6.0",
    "yfinance>=0.2.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "time-machine>=2.14.0",
    "responses>=0.25.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core", "config"]
